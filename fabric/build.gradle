plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

def commonGeneratedResources = project(":common").file("src/generated/resources").absolutePath
def modId = rootProject.property("mod_id")

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

    common(project(path: ":common", configuration: "namedElements")) {
        transitive = false
    }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) {
        transitive = false
    }
}

loom {
    runs {
        datagen {
            client()
            name = "Fabric Data Generation"
            runDir = "build/datagen"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.modid=${modId}"
            vmArg "-Dfabric-api.datagen.output-dir=${commonGeneratedResources}"
        }
    }
}

processResources {
    inputs.property "version", rootProject.mod_version
    inputs.property "minecraft_version", rootProject.minecraft_version
    inputs.property "fabric_loader_version", rootProject.fabric_loader_version
    inputs.property "architectury_api_version", rootProject.architectury_api_version
    inputs.property "fabric_api_version", rootProject.fabric_api_version
    inputs.property "mod_id", rootProject.mod_id
    inputs.property "mod_name", rootProject.mod_name
    inputs.property "mod_license", rootProject.mod_license
    inputs.property "mod_authors", rootProject.mod_authors
    inputs.property "mod_description", rootProject.mod_description

    filesMatching("fabric.mod.json") {
        expand(
                version: rootProject.mod_version,
                minecraft_version: rootProject.minecraft_version,
                fabric_loader_version: rootProject.fabric_loader_version,
                architectury_api_version: rootProject.architectury_api_version,
                fabric_api_version: rootProject.fabric_api_version,
                mod_id: rootProject.mod_id,
                mod_name: rootProject.mod_name,
                mod_license: rootProject.mod_license,
                mod_authors: rootProject.mod_authors,
                mod_description: rootProject.mod_description
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    dependsOn shadowJar
    archiveClassifier = null
}
